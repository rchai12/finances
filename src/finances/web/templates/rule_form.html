<form method="post" action="/categories/rules/add" class="fields">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if back %}<input type="hidden" name="back" value="{{ back }}">{% endif %}
  <label>Merchant pattern <input name="pattern" required maxlength="100" value="{{ rule_form.pattern }}"></label>
  <label>Match
    <select name="match">
      {% for match in matches %}<option value="{{ match }}"{% if match == rule_form.match %} selected{% endif %}>{{ match }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Priority <input name="priority" inputmode="numeric" maxlength="6" value="{{ rule_form.priority }}"></label>
  <label>Category
    {% with selected = rule_form.category %}{% include "category_select.html" %}{% endwith %}
  </label>
  <button type="submit">Add rule</button>
</form>
