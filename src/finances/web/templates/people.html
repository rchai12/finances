{% extends "layout.html" %}
{% block title %}People · Finances{% endblock %}
{% block content %}
<h1>People</h1>
{% if rows %}
<table>
<thead><tr><th>Name</th><th>Owns</th><th>Cardholder names</th></tr></thead>
<tbody>
{% for row in rows %}<tr><td>{{ row.name }}</td><td>{{ row.owns }}</td><td>{{ row.cardholders }}</td></tr>
{% endfor %}</tbody>
</table>
{% else %}
<p class="empty">No people.</p>
{% endif %}
{% endblock %}
